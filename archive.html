<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
  >

  <title>My Content Calendar - Year</title>

  <link
      rel="stylesheet"
      href="archive.css"
  >

</head>


<body>


<header class="site-header">

  <h1>My Content Calendar</h1>

  <p>
    내가 즐겼던 콘텐츠를 한 해 동안 돌아봅니다.
  </p>


  <!-- 페이지 이동 -->

  <nav class="page-navigation">

    <a
        href="index.html"
        class="page-link"
    >
      Month
    </a>


    <a
        href="archive.html"
        class="page-link active"
    >
      Year
    </a>

  </nav>

</header>



<main class="archive-container">


  <!-- =================================
       연도 선택
  ================================== -->

  <section class="year-control">

    <button
        id="prev-year"
        class="control-button"
        aria-label="이전 연도"
    >
      ◀
    </button>


    <h2 id="current-year">
      2026
    </h2>


    <button
        id="next-year"
        class="control-button"
        aria-label="다음 연도"
    >
      ▶
    </button>

  </section>



  <!-- =================================
       연간 콘텐츠
  ================================== -->

  <section class="archive-section">

    <div class="archive-heading">

      <h3 id="archive-title">
        2026년에 즐겼던 콘텐츠
      </h3>

      <p id="archive-count">
        0개의 콘텐츠
      </p>

    </div>


    <div
        class="content-carousel"
        id="content-carousel"
    >
      <!-- JavaScript로 카드 생성 -->

    </div>


    <!-- 좌우 이동 버튼 -->

    <div class="carousel-controls">

      <button
          id="prev-content"
          class="carousel-button"
          aria-label="이전 콘텐츠"
      >
        ◀
      </button>


      <button
          id="next-content"
          class="carousel-button"
          aria-label="다음 콘텐츠"
      >
        ▶
      </button>

    </div>

  </section>


</main>



<footer class="site-footer">

  <p>
    My Content Calendar (year.ver)
  </p>

</footer>



<script src="js/data/contents.js"></script>

<script src="js/archive.js"></script>

</body>

</html>
